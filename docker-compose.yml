version: '3.8'

services:
  # SIA Sentinel API
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - EVIDENCE_SIGNING_KEY=${EVIDENCE_SIGNING_KEY:-dev-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    volumes:
      - ./logs:/app/logs
      - ./evidence:/app/evidence
      - ./policies:/app/policies
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - ./evidence:/app/evidence
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped
    depends_on:
      - sentinel

  # Optional: PostgreSQL for production evidence storage
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     - POSTGRES_DB=sia_sentinel
  #     - POSTGRES_USER=siauser
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

volumes:
  postgres_data:
